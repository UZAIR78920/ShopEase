<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse the ShopEase collection of thoughtfully selected products."
    />
    <title>ShopEase - Product Catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="ShopEase home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>shop<span class="brand-accent">ease</span></span>
      </a>
      <span class="header-note">A little something for every day</span>
    </header>

    <main>
      <section class="catalog-intro" aria-labelledby="catalog-title">
        <p class="eyebrow">THE EVERYDAY EDIT</p>
        <h1 id="catalog-title">Find your next <span>favorite.</span></h1>
        <p class="intro-copy">
          Good things, picked just for you. Take a look around.
        </p>
      </section>

      <section class="catalog" aria-label="Product catalog">
        <div class="catalog-toolbar">
          <div
            class="category-filters"
            role="group"
            aria-label="Filter products by category"
          >
            <button class="filter-button is-active" type="button" data-category="All" aria-pressed="true">
              All products
            </button>
            <button class="filter-button" type="button" data-category="Electronics" aria-pressed="false">
              Electronics
            </button>
            <button class="filter-button" type="button" data-category="Accessories" aria-pressed="false">
              Accessories
            </button>
            <button class="filter-button" type="button" data-category="Home" aria-pressed="false">
              Home
            </button>
            <button class="filter-button" type="button" data-category="Clothing" aria-pressed="false">
              Clothing
            </button>
          </div>
          <p class="product-count" id="product-count" aria-live="polite"></p>
        </div>

        <div class="product-grid" id="product-grid" aria-live="polite"></div>
        <p class="empty-state" id="empty-state" hidden>
          There are no products in this category yet.
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <span class="brand footer-brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>shop<span class="brand-accent">ease</span></span>
      </span>
      <p>Thoughtful finds for the everyday.</p>
    </footer>
  </body>
</html>
